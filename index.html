  font-family: "Pretendard Quiz", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: clamp(1.25rem, 4vw, 3rem) 1.1rem 4rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

.app { max-width: 600px; width: 100%; }

/* ---------- Header ---------- */
.masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.75rem; }
.eyebrow { font-weight: 600; font-size: 12px; letter-spacing: 0.11em; color: var(--accent); margin-bottom: 0.6rem; }
h1 { font-weight: 800; font-size: clamp(24px, 5.2vw, 30px); letter-spacing: -0.01em; line-height: 1.28; text-wrap: balance; margin-bottom: 0.55rem; }
.subtitle { font-size: 14.5px; color: var(--ink-soft); line-height: 1.65; }
.share-btn {
  flex: none; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 0.5rem 0.85rem; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
  cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, color .15s;
}
.share-btn:hover { border-color: var(--accent); color: var(--accent-strong); }

/* ---------- Intro ---------- */
.intro-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.6rem 1.5rem; box-shadow: var(--shadow); }
.intro-meta { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; letter-spacing: 0.02em; margin-bottom: 0.9rem; }
.intro-meta b { color: var(--ink-soft); }
.intro-body { font-size: 14.5px; color: var(--ink-soft); line-height: 1.75; margin-bottom: 1.4rem; }
.badge-preview { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 1.5rem; scrollbar-width: none; }
.badge-preview::-webkit-scrollbar { display: none; }
.badge-chip {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 19px; background: color-mix(in srgb, var(--pc) 16%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--pc) 32%, var(--line));
}
.start-btn {
  width: 100%; padding: 0.95rem; background: var(--cta); color: var(--cta-ink); border: none; border-radius: var(--radius-md);
  font-size: 15px; font-weight: 700; cursor: pointer; transition: filter .15s, transform .1s;
}
.start-btn:hover { filter: brightness(1.08); }
.start-btn:active { transform: scale(0.99); }

/* ---------- Progress trail ---------- */
.trail { display: flex; align-items: center; margin-bottom: 1.9rem; }
.trail-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .25s, transform .25s; }
.trail-seg { flex: 1; height: 2px; background: var(--line); margin: 0 3px; position: relative; overflow: hidden; }
.trail-seg::after { content: ""; position: absolute; inset: 0; background: var(--accent); width: var(--fill, 0%); transition: width .3s ease; }
.trail-dot.done { background: var(--accent); }
.trail-dot.current { background: var(--cta); transform: scale(1.55); box-shadow: 0 0 0 4px color-mix(in srgb, var(--cta) 22%, transparent); }

/* ---------- Question ---------- */
.q-tag { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 0.7rem; }
.question-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.6rem 1.5rem; margin-bottom: 1.4rem; box-shadow: var(--shadow); animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.question-text { font-size: 18px; font-weight: 700; line-height: 1.55; text-wrap: balance; margin-bottom: 1.35rem; }
.options { display: flex; flex-direction: column; gap: 9px; }
.option-btn {
  display: flex; align-items: center; gap: 0.75rem; background: var(--surface-2); border: 1.5px solid transparent;
  border-radius: var(--radius-sm); padding: 0.8rem 0.95rem; text-align: left; cursor: pointer; font-size: 14.5px;
  color: var(--ink); line-height: 1.5; transition: border-color .15s, background .15s;
}
.option-btn .mark { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-faint); position: relative; transition: border-color .15s, background .15s; }
.option-btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.option-btn.selected { border-color: var(--accent); background: var(--accent-tint); font-weight: 600; }
.option-btn.selected .mark { border-color: var(--accent); background: var(--accent); }
.option-btn.selected .mark::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--cta-ink); }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
.nav-btn { background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 0.65rem 1.15rem; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft); transition: border-color .15s, color .15s; }
.nav-btn:hover:not(:disabled) { border-color: var(--ink-soft); color: var(--ink); }
.nav-btn.primary { background: var(--cta); color: var(--cta-ink); border-color: transparent; }
.nav-btn.primary:hover { filter: brightness(1.08); }
.nav-btn:disabled { opacity: 0.4; cursor: default; }
.q-count { font-size: 13px; color: var(--ink-faint); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Result ---------- */
.result-header { text-align: center; padding: 0.5rem 0 1.4rem; animation: rise .4s ease; }
.rosette { position: relative; width: 104px; height: 104px; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: color-mix(in srgb, var(--pc) 14%, var(--surface)); border: 2px solid color-mix(in srgb, var(--pc) 55%, var(--line)); }
.rosette::before { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1.5px dashed color-mix(in srgb, var(--pc) 45%, transparent); animation: spin 28s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.rosette .emoji { font-size: 44px; }
.result-title { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 0.35rem; }
.top-name { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 0.25rem; }
.top-en { font-size: 13px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--pc); }

.top-result { background: color-mix(in srgb, var(--pc) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pc) 28%, var(--line)); border-radius: var(--radius-lg); padding: 1.3rem 1.4rem; margin-bottom: 1.6rem; }
.desc-text { font-size: 14.5px; color: var(--ink); line-height: 1.75; }

.scores-title { font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 0.75rem; }
.scores-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 1.6rem; }
.score-row { display: flex; align-items: center; gap: 0.7rem; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 0.6rem 0.85rem; opacity: 0; animation: rise .35s ease forwards; }
.score-row.top { border-color: var(--pc); }
.score-rank { flex: none; width: 18px; font-size: 12px; font-weight: 700; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.score-emoji { flex: none; font-size: 17px; }
.score-body { flex: 1; min-width: 0; }
.score-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 8px; }
.score-name { font-size: 13px; font-weight: 600; }
.score-val { font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; flex: none; }
.score-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 2px; background: var(--pc); transition: width .5s ease; }

.radar-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.3rem 1.2rem 1.1rem; margin-bottom: 1.6rem; opacity: 0; animation: rise .4s ease forwards; animation-delay: .25s; }
.radar-wrap { position: relative; max-width: 300px; margin: 0 auto; }
svg.radar { display: block; width: 100%; height: auto; overflow: visible; }
.radar-grid { fill: none; stroke: var(--line); stroke-width: 1; }
.radar-spoke { stroke: var(--line); stroke-width: 1; }
.radar-area { fill: var(--pc); fill-opacity: .16; stroke: var(--pc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.radar-vertex { fill: var(--pc); stroke: var(--surface); stroke-width: 2; }
.radar-hit { fill: transparent; cursor: pointer; }
.radar-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.radar-emoji { font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
.radar-tooltip { position: absolute; pointer-events: none; left: 0; top: 0; transform: translate(-50%, calc(-100% - 10px)); background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 0.4rem 0.6rem; border-radius: 8px; box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; white-space: nowrap; z-index: 5; }
.radar-tooltip.show { opacity: 1; }
.radar-caption { font-size: 12.5px; color: var(--ink-faint); text-align: center; margin-top: 0.5rem; }

.result-actions { display: flex; gap: 9px; }
.result-actions button { flex: 1; padding: 0.85rem; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; transition: filter .15s, border-color .15s; }
.share-result-btn { background: transparent; border: 1.5px solid var(--line); color: var(--ink-soft); }
.share-result-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
.restart-btn { background: var(--ink); color: var(--bg); border: none; }
.restart-btn:hover { filter: brightness(1.15); }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: 1.6rem; transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; padding: 0.7rem 1.1rem; border-radius: 999px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

footer.hint { text-align: center; font-size: 12px; color: var(--ink-faint); margin-top: 1.6rem; }

@media (max-width: 380px) {
  .top-name { font-size: 23px; }
  .question-text { font-size: 16.5px; }
}
</style>

function renderIntro() {
  const chips = profiles.map(p => `<div class="badge-chip" style="--pc:${p.color}" title="${p.name}">${p.emoji}</div>`).join('');
  document.getElementById('root').innerHTML = `
    <div class="intro-card">
      <div class="intro-meta">10문항 &nbsp;·&nbsp; 약 2분 &nbsp;·&nbsp; <b>결과 저장 없이 즉시 확인</b></div>
      <p class="intro-body">국제 바칼로레아(IB) PYP 프로그램의 학습자상 10가지 특성 중, 답변을 바탕으로 나와 가장 닮은 모습 하나를 찾아드려요.</p>
      <div class="badge-preview">${chips}</div>
      <button class="start-btn" onclick="startQuiz()">시작하기 →</button>
    </div>`;
}
function startQuiz() { started = true; renderQuestion(); }

function renderTrail() {
  let html = '<div class="trail">';
  for (let i = 0; i < questions.length; i++) {
    const state = i < current ? 'done' : (i === current ? 'current' : '');
    html += `<div class="trail-dot ${state}"></div>`;
    if (i < questions.length - 1) {
      const fill = i < current ? '100%' : '0%';
      html += `<div class="trail-seg" style="--fill:${fill}"></div>`;
    }
  }
  html += '</div>';
  return html;
}
function renderQuestion() {
  const q = questions[current];
  const opts = q.options.map((o, i) => {
    const sel = answers[current] === i ? 'selected' : '';
    return `<button class="option-btn ${sel}" onclick="selectOpt(${i})"><span class="mark"></span>${o.text}</button>`;
  }).join('');
  const canNext = answers[current] !== null;
  const isLast = current === questions.length - 1;
  document.getElementById('root').innerHTML = `
    ${renderTrail()}
    <div class="q-tag">질문 ${current + 1}</div>
    <div class="question-card">
      <div class="question-text">${q.text}</div>
      <div class="options">${opts}</div>
    </div>
    <div class="nav">
      <button class="nav-btn" onclick="prevQ()" ${current === 0 ? 'disabled' : ''}>← 이전</button>
      <span class="q-count">${current + 1} / ${questions.length}</span>
      ${canNext
        ? `<button class="nav-btn primary" onclick="nextQ()">${isLast ? '결과 보기 →' : '다음 →'}</button>`
        : `<button class="nav-btn" disabled>선택 후 다음</button>`}
    </div>`;
}
function selectOpt(idx) {
  const prev = answers[current];
  if (prev !== null) questions[current].options[prev].profiles.forEach(p => scores[p]--);
  answers[current] = idx;
  questions[current].options[idx].profiles.forEach(p => scores[p]++);
  renderQuestion();
}
function prevQ() { if (current > 0) { current--; renderQuestion(); } }
function nextQ() {
  if (answers[current] === null) return;
  if (current < questions.length - 1) { current++; renderQuestion(); }
  else renderResult();
}
function renderResult() {
  const sorted = profiles.map(p => ({ ...p, score: scores[p.id] })).sort((a, b) => b.score - a.score);
  const top = sorted[0];
  const maxScore = Math.max(1, ...sorted.map(p => p.score));
  const scoreRows = sorted.map((p, i) => {
    const barW = Math.round((Math.max(0, p.score) / maxScore) * 100);
    return `<div class="score-row ${p.id === top.id ? 'top' : ''}" style="--pc:${p.color}; animation-delay:${i * 0.04}s">
      <span class="score-rank">${i + 1}</span>
      <span class="score-emoji">${p.emoji}</span>
      <div class="score-body">
        <div class="score-top"><span class="score-name">${p.name}</span><span class="score-val">${p.score}점</span></div>
        <div class="score-bar"><div class="score-fill" style="width:${barW}%"></div></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('root').innerHTML = `
    <div class="result-header" style="--pc:${top.color}">
      <div class="rosette" style="--pc:${top.color}"><span class="emoji">${top.emoji}</span></div>
      <div class="result-title">나의 대표 학습자상</div>
      <div class="top-name">${top.name}</div>
      <div class="top-en">${top.en}</div>
    </div>
    <div class="top-result" style="--pc:${top.color}"><div class="desc-text">${top.desc}</div></div>
    <div class="scores-title">학습자상 순위</div>
    <div class="scores-list">${scoreRows}</div>
    <div class="scores-title">10각형 밸런스 차트</div>
    <div class="radar-card">
      ${buildRadar(top, maxScore)}
      <p class="radar-caption">점수가 높을수록 바깥쪽으로 뻗어나가요 · 각 꼭짓점을 눌러보세요</p>
    </div>
    <div class="result-actions">
      <button class="share-result-btn" onclick="shareLink()">🔗 링크 공유</button>
      <button class="restart-btn" onclick="restart()">↺ 다시 하기</button>
    </div>
    <footer class="hint">이 링크를 그대로 보내면 누구든 바로 진단을 시작할 수 있어요.</footer>`;
}
function buildRadar(top, maxScore) {
  const cx = 120, cy = 120, maxR = 82, n = profiles.length;
  const angleFor = i => (360 / n) * i;
  const pointAt = (angleDeg, r) => {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  };
  const ringPath = r => profiles.map((_, i) => {
    const [x, y] = pointAt(angleFor(i), r);
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ') + ' Z';
  const grid = [0.33, 0.66, 1].map(f => `<path class="radar-grid" d="${ringPath(maxR * f)}"></path>`).join('');
  const spokes = profiles.map((_, i) => {
    const [x, y] = pointAt(angleFor(i), maxR);
    return `<line class="radar-spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"></line>`;
  }).join('');
  const dataR = profiles.map(p => maxR * (Math.max(0, scores[p.id]) / maxScore));
  const areaPath = profiles.map((_, i) => {
    const [x, y] = pointAt(angleFor(i), dataR[i]);
    return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`;
  }).join(' ') + ' Z';
  const vertices = profiles.map((p, i) => {
    const [x, y] = pointAt(angleFor(i), dataR[i]);
    const label = `${p.name} ${scores[p.id]}점`;
    return `<circle class="radar-vertex" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"></circle>
      <circle class="radar-hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" tabindex="0" role="img" aria-label="${label}"
        onpointerenter="showRadarTip(this,'${label.replace(/'/g, "\\'")}')" onpointerleave="hideRadarTip(this)"
        onfocus="showRadarTip(this,'${label.replace(/'/g, "\\'")}')" onblur="hideRadarTip(this)"></circle>`;
  }).join('');
  const labels = profiles.map((p, i) => {
    const [x, y] = pointAt(angleFor(i), maxR + 18);
    return `<text class="radar-emoji" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${p.emoji}</text>`;
  }).join('');
  return `<div class="radar-wrap" style="--pc:${top.color}">
    <svg class="radar" viewBox="0 0 240 240">
      ${grid}${spokes}
      <path class="radar-area" d="${areaPath}"></path>
      ${vertices}${labels}
    </svg>
    <div class="radar-tooltip" id="radarTip"></div>
  </div>`;
}
function showRadarTip(el, label) {
  const wrap = el.closest('.radar-wrap');
  const tip = wrap.querySelector('.radar-tooltip');
  tip.textContent = label;
  tip.style.left = (el.getAttribute('cx') / 240 * 100) + '%';
  tip.style.top = (el.getAttribute('cy') / 240 * 100) + '%';
  tip.classList.add('show');
}
function hideRadarTip(el) {
  el.closest('.radar-wrap').querySelector('.radar-tooltip').classList.remove('show');
}
function restart() {
  current = 0; answers = new Array(questions.length).fill(null); scores = {};
  profiles.forEach(p => scores[p.id] = 0); renderQuestion();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function shareLink() {
  const url = location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url }).catch(() => {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showToast('링크가 복사되었어요')).catch(() => showToast(url));
  } else {
    showToast(url);
  }
}
renderIntro();
</script>
</body>
</html>

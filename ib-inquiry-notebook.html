<style>

    --brass: #D7A24A; --brass-strong: #F0BE72; --brass-tint: #3C331C;

  --ink: #EDE7D1; --ink-soft: #B9B092; --ink-faint: #786F52;
  --line: #3A4030; --line-strong: #4C5339;
  --brass: #D7A24A; --brass-strong: #F0BE72; --brass-tint: #3C331C;

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; width: 100%; padding: .85rem 1rem; border: none; border-radius: var(--radius-sm); background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 14.5px; font-weight: 700; cursor: pointer; transition: filter .15s, transform .1s; }

.badge.checked .badge-ring { border-color: var(--bc); background: color-mix(in srgb, var(--bc) 18%, var(--paper-2)); transform: scale(1.05); }

.map-pin-name { font-size: 11px; font-weight: 700; line-height: 1.25; }
.map-pin-title { font-family: var(--mono); font-size: 9px; color: var(--ink-faint); margin: .1rem 0 .3rem; }

/* ---- badge-earned celebration ---- */

/* ---- quiz ---- */
.trail { display: flex; align-items: center; gap: 4px; margin-bottom: 1rem; }

.trail-bar.done { background: var(--stamp); }

/* ---- result ---- */
.result-top { text-align: center; padding: .3rem 0 1.2rem; }
.seal { width: 74px; height: 74px; margin: 0 auto .8rem; border-radius: 50%; background: var(--rc); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 6px 18px color-mix(in srgb, var(--rc) 45%, transparent); }
.result-kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
.result-name { font-family: var(--serif); font-size: 25px; font-weight: 700; margin: .2rem 0 .1rem; }

.rank-row { display: grid; grid-template-columns: 20px 26px 1fr auto; align-items: center; gap: .55rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.rank-row:last-child { border-bottom: none; }

.tool-bar { display: flex; flex-direction: column; gap: .55rem; background: var(--paper-3); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .7rem .75rem; margin: 0 0 1.1rem; }

.tool-link, .timer-btn2 { display: inline-flex; align-items: center; gap: .3rem; padding: .5rem .7rem; border-radius: var(--radius-sm); border: 1.5px solid var(--line-strong); background: var(--paper); color: var(--ink-soft); font-size: 12px; font-weight: 700; text-decoration: none; white-space: nowrap; cursor: pointer; font-family: var(--sans); }
.tool-link:hover, .timer-btn2:hover { border-color: var(--brass); color: var(--brass-strong); }

.video-link { display: inline-flex; align-items: center; gap: .35rem; margin-top: .55rem; font-size: 12.5px; font-weight: 700; color: var(--brass-strong); text-decoration: none; border-bottom: 1.5px dashed var(--brass); padding-bottom: 1px; }
.video-link:hover { color: var(--stamp); border-color: var(--stamp); }
.card-tag-row { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
.tag { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: .3rem .6rem; border-radius: 999px; }
.tag.trait { color: #fff; background: var(--tc); }
.tag.atl { color: var(--ink-soft); background: var(--paper-3); border: 1px solid var(--line); }
.card-no { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-left: auto; }
.section-label { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .07em; color: var(--ink-faint); text-transform: uppercase; margin: 1.15rem 0 .4rem; }

.body-text { font-size: 14.3px; line-height: 1.7; margin: 0; }
.mission-text { font-size: 13.5px; line-height: 1.65; color: var(--ink-soft); margin: 0; }

.summary-row { display: flex; align-items: center; gap: .75rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
.summary-row:last-child { border-bottom: none; }
.summary-badge { width: 42px; height: 42px; border-radius: 50%; background: var(--tc); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: none; }
.summary-body { flex: 1; }
.summary-name { font-weight: 700; font-size: 13.8px; }
.summary-lvl { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
.summary-bar-wrap { height: 4px; background: var(--paper-3); border-radius: 2px; overflow: hidden; margin-top: .3rem; }
.summary-bar { height: 100%; background: var(--tc); }

.foot-note { text-align: center; font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); margin-top: 1.6rem; letter-spacing: .03em; }
</style>

/* ---- local profiles: no account, no external login, no server ----
   Each profile's progress is namespaced by id and stored only in this
   browser's localStorage, so several people can share one device. */
const USERS_KEY = "ib_users_v1";
const AVATARS = ["🦁", "🐯", "🐼", "🦊", "🐰", "🐨", "🐸", "🦄", "🐬", "🦉"];
function loadUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY)) || { list: [], activeId: null }; } catch (e) { return { list: [], activeId: null }; } }
function saveUsers() { try { localStorage.setItem(USERS_KEY, JSON.stringify(userState)); } catch (e) {} }
let userState = loadUsers();
let pickedAvatar = AVATARS[0];
function activeUser() { return userState.list.find(u => u.id === userState.activeId); }
function scopedKey(base) { return base + '__' + (userState.activeId || 'guest'); }

const STORAGE_KEY = "ib_field_notes_v1";
function loadProgress() { try { return JSON.parse(localStorage.getItem(scopedKey(STORAGE_KEY))) || {}; } catch (e) { return {}; } }
function saveProgress() { try { localStorage.setItem(scopedKey(STORAGE_KEY), JSON.stringify(progress)); } catch (e) {} }
function traitProgress(id) { return progress[id] || (progress[id] = { done: [], journal: {} }); }
function traitTotal(id) { return CARDS[id].length; }
function traitDoneCount(id) { return traitProgress(id).done.length; }
function traitBadgeEarned(id) { return traitDoneCount(id) >= traitTotal(id); }

const DAILY_LIMIT = 2;
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const DAILY_KEY = "ib_field_daily_v1", STREAK_KEY = "ib_field_streak_v1";
function loadDaily() { try { return JSON.parse(localStorage.getItem(scopedKey(DAILY_KEY))) || { date: todayStr(), count: 0 }; } catch (e) { return { date: todayStr(), count: 0 }; } }
function saveDaily() { try { localStorage.setItem(scopedKey(DAILY_KEY), JSON.stringify(daily)); } catch (e) {} }
function loadStreak() { try { return JSON.parse(localStorage.getItem(scopedKey(STREAK_KEY))) || { lastDate: null, count: 0 }; } catch (e) { return { lastDate: null, count: 0 }; } }
function saveStreak() { try { localStorage.setItem(scopedKey(STREAK_KEY), JSON.stringify(streak)); } catch (e) {} }
function ensureDailyFresh() { if (daily.date !== todayStr()) { daily.date = todayStr(); daily.count = 0; saveDaily(); } }
function dailyRemaining() { ensureDailyFresh(); return Math.max(0, DAILY_LIMIT - daily.count); }
function bumpDailyAndStreak() {
  ensureDailyFresh();
  daily.count++; saveDaily();
  if (streak.lastDate !== todayStr()) {
    streak.count = (streak.lastDate === yesterdayStr()) ? streak.count + 1 : 1;
    streak.lastDate = todayStr();
    saveStreak();
  }
}
function loadUserData() { progress = loadProgress(); daily = loadDaily(); streak = loadStreak(); }

function root() { return document.getElementById('root'); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

  el.innerHTML = u ? `<button class="profile-chip" onclick="renderUserGate()">${u.avatar} ${u.name} · 전환</button>` : 'IB PYP Field Notes';
}
function renderUserGate() {
  const el = document.getElementById('mastRight');
  if (el) el.textContent = 'IB PYP Field Notes';
  pickedAvatar = AVATARS[0];

      ${userState.list.length ? `<div class="section-label">프로필 선택</div><div class="user-grid">${userCards}</div>` : ''}

      <input class="field" id="newUserName" placeholder="이름이나 별명 (최대 8자)" maxlength="8">
      <div class="avatar-grid">${avatarButtons}</div>
      <button class="btn accent" style="margin-top:.9rem" onclick="createUser()">시작하기 →</button>
      <p class="user-note">삭제 버튼(✕)을 누르면 그 프로필의 기록이 이 기기에서 완전히 사라져요.</p>
    </div>`;
}
function pickAvatar(a) {
  pickedAvatar = a;
  document.querySelectorAll('.avatar-btn').forEach(el => el.classList.toggle('selected', el.dataset.a === a));
}
function afterUserChosen() {
  loadUserData();
  updateMastRight();
  renderCover();
}
function createUser() {
  const nameInput = document.getElementById('newUserName');
  const name = (nameInput.value || '').trim().slice(0, 8) || '탐구자';
  const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  userState.list.push({ id, name, avatar: pickedAvatar, createdAt: Date.now() });
  userState.activeId = id;
  saveUsers();
  afterUserChosen();
}
function chooseUser(id) {
  userState.activeId = id;
  saveUsers();
  afterUserChosen();
}
function deleteUser(id) {
  if (!confirm('이 프로필과 저장된 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
  try {
    localStorage.removeItem(STORAGE_KEY + '__' + id);
    localStorage.removeItem(DAILY_KEY + '__' + id);
    localStorage.removeItem(STREAK_KEY + '__' + id);
  } catch (e) {}
  userState.list = userState.list.filter(u => u.id !== id);
  if (userState.activeId === id) userState.activeId = null;
  saveUsers();
  renderUserGate();
}
function boot() {
  if (userState.activeId && userState.list.some(u => u.id === userState.activeId)) {
    loadUserData();
    updateMastRight();
    renderCover();
  } else {
    renderUserGate();
  }
}

  root().innerHTML = `
    <div class="sheet">
      <div class="tape"></div>

      <div class="badge-grid">${PROFILES.map(p => `<div class="badge"><div class="badge-ring" style="border-color:${p.color}55">${p.emoji}</div></div>`).join('')}</div>
      <button class="btn accent" onclick="startQuiz()">수첩 펼치기 →</button>
    </div>`;
}
function startQuiz() { qCurrent = 0; renderQuestion(); }

function trailHtml(total, current, color) {
  let html = '<div class="trail">';
  for (let i = 0; i < total; i++) {
    html += `<div class="trail-tick ${i < current ? 'done' : ''}" style="${i < current ? `background:${color}` : ''}"></div>`;
    if (i < total - 1) html += `<div class="trail-bar ${i < current ? 'done' : ''}" style="${i < current ? `background:${color}` : ''}"></div>`;
  }
  return html + '</div>';
}

function renderQuestion() {
  const q = QUESTIONS[qCurrent];
  const opts = q.options.map((o, i) => `
    <button class="opt ${qAnswers[qCurrent] === i ? 'sel' : ''}" onclick="selectOpt(${i})"><span class="dot"></span>${o.text}</button>`).join('');
  root().innerHTML = `
    ${trailHtml(QUESTIONS.length, qCurrent, 'var(--stamp)')}
    <div class="sheet">
      <div class="q-num">문항 ${String(qCurrent + 1).padStart(2, '0')} / ${String(QUESTIONS.length).padStart(2, '0')}</div>
      <div class="q-text">${q.text}</div>
      <div class="opt-list">${opts}</div>
      <div class="nav-row">
        <button class="btn ghost small" onclick="prevQ()" ${qCurrent === 0 ? 'disabled' : ''}>← 이전</button>
        <span class="nav-count">${qCurrent + 1} / ${QUESTIONS.length}</span>
        <button class="btn accent small" onclick="nextQ()" ${qAnswers[qCurrent] === null ? 'disabled' : ''}>${qCurrent === QUESTIONS.length - 1 ? '결과 보기 →' : '다음 →'}</button>
      </div>
    </div>`;
}
function selectOpt(i) {
  const prev = qAnswers[qCurrent];
  if (prev !== null) QUESTIONS[qCurrent].options[prev].profiles.forEach(p => qScores[p]--);
  qAnswers[qCurrent] = i;
  QUESTIONS[qCurrent].options[i].profiles.forEach(p => qScores[p]++);
  renderQuestion();
}
function prevQ() { if (qCurrent > 0) { qCurrent--; renderQuestion(); } }
function nextQ() {
  if (qAnswers[qCurrent] === null) return;
  if (qCurrent < QUESTIONS.length - 1) { qCurrent++; renderQuestion(); }
  else renderResult();
}

function renderResult() {
  const sorted = PROFILES.map(p => ({ ...p, score: qScores[p.id] })).sort((a, b) => b.score - a.score);
  const top = sorted[0];
  const maxScore = Math.max(1, ...sorted.map(p => p.score));
  const rows = sorted.map((p, i) => `
    <div class="rank-row">
      <span class="rank-num">${String(i + 1).padStart(2, '0')}</span>
      <span>${p.emoji}</span>
      <span class="rank-name">${p.name}</span>
      <span class="rank-score">${p.score}</span>
    </div>
    <div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.round(Math.max(0, p.score) / maxScore * 100)}%; --rc2:${p.color}"></div></div>`).join('');
  const weakest = sorted[sorted.length - 1], second = sorted[sorted.length - 2];
  root().innerHTML = `
    <div class="sheet">
      <div class="result-top">
        <div class="seal" style="--rc:${top.color}">${top.emoji}</div>
        <div class="result-kicker">Field Reading</div>
        <div class="result-name">${top.name}</div>
        <div class="result-en">${top.en}</div>
        <p class="result-desc">${top.desc}</p>
      </div>
      <div class="section-label">전체 순위</div>
      ${rows}
      ${compassSvg(sorted, maxScore, top.color)}
      <div class="cta-sheet">
        <div class="cta-eyebrow">다음 페이지</div>
        <p class="cta-text">상대적으로 옅게 나온 <b>${weakest.name}</b>, <b>${second.name}</b> 영역을 질문에 답하며 채워볼까요?</p>
        <button class="btn accent" onclick="goToGame(['${weakest.id}','${second.id}'])">🧭 탐구 질문 페이지로 →</button>
      </div>
      <button class="btn ghost" style="margin-top:.6rem" onclick="renderCover()">↺ 처음부터 다시</button>
    </div>`;
}
function compassSvg(sorted, maxScore, topColor) {
  const cx = 130, cy = 130, maxR = 78, n = PROFILES.length;
  const angleFor = i => (360 / n) * i;
  const pt = (deg, r) => { const rad = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; };
  const ring = r => PROFILES.map((_, i) => { const [x, y] = pt(angleFor(i), r); return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join(' ') + ' Z';
  const grid = [0.33, 0.66, 1].map(f => `<path d="${ring(maxR * f)}" fill="none" stroke="var(--line-strong)" stroke-width="1"></path>`).join('');
  const spokes = PROFILES.map((_, i) => { const [x, y] = pt(angleFor(i), maxR); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"></line>`; }).join('');
  const dataR = PROFILES.map(p => maxR * (Math.max(0, qScores[p.id]) / maxScore));
  const area = PROFILES.map((_, i) => { const [x, y] = pt(angleFor(i), dataR[i]); return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join(' ') + ' Z';
  const dots = PROFILES.map((p, i) => { const [x, y] = pt(angleFor(i), dataR[i]); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${p.color}"></circle>`; }).join('');
  const labels = PROFILES.map((p, i) => { const [x, y] = pt(angleFor(i), maxR + 20); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="11">${p.emoji}</text>`; }).join('');
  return `<div class="section-label">균형 나침반</div><div class="compass-svg-wrap"><svg width="260" height="260" viewBox="0 0 260 260">${grid}${spokes}<path d="${area}" fill="${topColor}33" stroke="${topColor}" stroke-width="1.5"></path>${dots}${labels}</svg></div>`;
}

/* ---------------- screen: trait picker for the question game ---------------- */
function goToGame(weakIds) { selected = weakIds.slice(0, 3); renderPicker(); }

function stampRowHtml(id) {
  const total = traitTotal(id), done = traitDoneCount(id), color = PROFILE_MAP[id].color;
  let html = '<div class="stamp-row">';
  for (let i = 0; i < total; i++) html += `<span class="stamp-box ${i < done ? 'filled' : ''}" style="--tc:${color}"></span>`;
  return html + '</div>';
}

function renderPicker() {
  ensureDailyFresh();
  const badges = PROFILES.map(p => {
    const checked = selected.includes(p.id), disabled = !checked && selected.length >= 3;
    const earned = traitBadgeEarned(p.id);
    return `<button class="badge ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}" style="--bc:${p.color}" ${disabled ? 'disabled' : ''} onclick="toggleTrait('${p.id}')">
      <div class="badge-ring" style="border-color:${p.color}66">${p.emoji}${earned ? '<span class="badge-medal">🏅</span>' : ''}</div>
      <div class="badge-name">${p.name}</div>
      ${stampRowHtml(p.id)}
    </button>`;
  }).join('');
  const remain = dailyRemaining();
  const streakLine = streak.count >= 1 ? `🔥 연속 ${streak.count}일째 탐구 중!` : '오늘부터 탐구를 시작해요!';
  root().innerHTML = `
    <div class="sheet">
      <div class="eyebrow">Entry No. 02 — Field Notes</div>
      <h2 class="title">질문에 답하며 채울 영역</h2>
      <p class="lede">키우고 싶은 학습자상을 최대 3개까지 골라보세요. 하루에 ${DAILY_LIMIT}장씩, 조금씩 채워가요.</p>
      <div class="daily-strip">
        <span>${streakLine}</span>
        <span class="daily-remain">오늘 남은 카드 ${remain}장</span>
      </div>
      <div class="badge-grid">${badges}</div>
      <p class="select-note">${selected.length} / 3 선택됨</p>
      <button class="btn accent" ${selected.length === 0 ? 'disabled' : ''} onclick="renderHowto()">다음 →</button>
      <button class="btn ghost" style="margin-top:.6rem" onclick="renderMap()">🗺️ 나의 탐구 지도 보기</button>
      <button class="btn ghost" style="margin-top:.6rem" onclick="renderCover()">← 진단으로 돌아가기</button>
    </div>`;
}
function toggleTrait(id) {
  const i = selected.indexOf(id);
  if (i >= 0) selected.splice(i, 1); else if (selected.length < 3) selected.push(id);
  renderPicker();
}

const MAP_VB_W = 320, MAP_VB_H = 1560;

// Winding trail waypoints, computed (not hand-tuned per point) from a sine sweep.
function mapWaypoints(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = 50 + 27 * Math.sin(t * Math.PI * 2.4 + 0.5);
    const y = 8 + t * 84;
    pts.push({ x, y });
  }
  return pts;
}
// Catmull-Rom -> cubic Bezier, so the trail is a smooth computed curve rather than hand-authored path data.
function smoothPath(points, vbW, vbH) {
  const pts = points.map(p => [p.x / 100 * vbW, p.y / 100 * vbH]);
  if (pts.length < 2) return '';
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)} `;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} `;
  }
  return d;
}
function pineSvg(x, y, scale) {
  const s = scale;
  return `<g transform="translate(${x} ${y}) scale(${s})" opacity="0.55">
    <rect x="-1.5" y="10" width="3" height="7" fill="var(--line-strong)"></rect>
    <path d="M0,-14 L9,6 L-9,6 Z" fill="var(--moss)"></path>
    <path d="M0,-6 L7,10 L-7,10 Z" fill="var(--moss)"></path>
  </g>`;
}
function hillSvg(cx, cy, rx, ry, color, opacity) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${color}" opacity="${opacity}"></ellipse>`;
}

function renderMap() {
  const pts = mapWaypoints(PROFILES.length);
  const trailD = smoothPath(pts, MAP_VB_W, MAP_VB_H);
  const allComplete = PROFILES.every(p => traitBadgeEarned(p.id));

  const hills = [
    hillSvg(40, 120, 130, 70, 'var(--moss)', 0.14),
    hillSvg(280, 340, 110, 60, 'var(--brass)', 0.12),
    hillSvg(30, 620, 120, 65, 'var(--brass)', 0.12),
    hillSvg(290, 860, 130, 70, 'var(--moss)', 0.14),
    hillSvg(20, 1120, 110, 60, 'var(--moss)', 0.12),
    hillSvg(300, 1380, 130, 75, 'var(--brass)', 0.14)
  ].join('');
  const trees = [
    pineSvg(46, 70, 1.1), pineSvg(268, 250, 1.3), pineSvg(50, 470, 1),
    pineSvg(260, 560, 1.2), pineSvg(40, 980, 1.1), pineSvg(270, 1240, 1.3),
    pineSvg(46, 1460, 1.1)
  ].join('');
  const endX = pts[pts.length - 1].x / 100 * MAP_VB_W, endY = pts[pts.length - 1].y / 100 * MAP_VB_H + 90;

  const pins = PROFILES.map((p, i) => {
    const total = traitTotal(p.id), done = traitDoneCount(p.id), earned = traitBadgeEarned(p.id);
    const state = earned ? 'complete' : (done > 0 ? 'active' : 'muted');
    return `<div class="map-pin ${state}" style="--tc:${p.color}; left:${pts[i].x}%; top:${pts[i].y}%">
      <div class="map-pin-dot">${earned ? '🏅' : p.emoji}${earned ? '<span class="map-pin-flag">🚩</span>' : ''}</div>
      <div class="map-pin-card">
        <div class="map-pin-name">${p.name}</div>
        <div class="map-pin-title">${earned ? BADGE_TITLES[p.id] : levelLabel(done, total)}</div>
        ${stampRowHtml(p.id)}
      </div>
    </div>`;
  }).join('');

  root().innerHTML = `
    <div class="sheet">
      <div class="eyebrow">나의 탐구 지도</div>
      <h2 class="title">10개 학습자상 여정</h2>
      <p class="lede">카드를 채울수록 길을 따라 깃발이 채워지고, 4칸을 다 채우면 뱃지를 받아요.</p>
      <div class="map-scene">
        <svg viewBox="0 0 ${MAP_VB_W} ${MAP_VB_H}" preserveAspectRatio="xMidYMid slice">
          ${hills}${trees}
          <path d="${trailD}" fill="none" stroke="var(--line-strong)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13"></path>
          <text x="${pts[0].x / 100 * MAP_VB_W}" y="${pts[0].y / 100 * MAP_VB_H - 42}" text-anchor="middle" font-size="13" fill="var(--ink-faint)" font-family="ui-monospace, monospace">START 🏁</text>
          <text x="${endX}" y="${endY}" text-anchor="middle" font-size="26">${allComplete ? '🏆' : '🎁'}</text>
          <text x="${endX}" y="${endY + 20}" text-anchor="middle" font-size="11" fill="var(--ink-faint)" font-family="ui-monospace, monospace">${allComplete ? 'COMPLETE!' : 'GOAL'}</text>
        </svg>
        ${pins}
      </div>
      <div class="map-legend">
        <span>⚪ 시작 전</span>
        <span>🎨 진행 중</span>
        <span>🚩 뱃지 완료</span>
      </div>
      <button class="btn accent" style="margin-top:1rem" onclick="renderPicker()">← 돌아가기</button>
    </div>`;
}

function renderHowto() {
  root().innerHTML = `
    <div class="sheet">
      <div class="eyebrow">How to use this page</div>
      <h2 class="title">질문에 답하며 생각 넓히기</h2>
      <p class="lede">카드마다 짧은 이야기와 질문 두 개가 나와요. 질문 1은 골라서, 질문 2는 직접 적으며 생각이 점점 넓어져요.</p>
      <div class="rank-row" style="grid-template-columns:22px 1fr"><span class="rank-num">01</span><span>오늘의 이야기를 읽어요.</span></div>
      <div class="rank-row" style="grid-template-columns:22px 1fr"><span class="rank-num">02</span><span>질문 1은 마음에 드는 답을 골라요.</span></div>
      <div class="rank-row" style="grid-template-columns:22px 1fr"><span class="rank-num">03</span><span>질문 2는 내 생각을 직접 적어봐요.</span></div>
      <div class="rank-row" style="grid-template-columns:22px 1fr"><span class="rank-num">04</span><span>탐구 활동을 하고, 배운 점을 적어요.</span></div>
      <button class="btn accent" style="margin-top:1rem" onclick="startQueue()">카드 뽑기 시작 →</button>
    </div>`;
}

function startQueue() {
  const remain = dailyRemaining();
  if (remain <= 0) { renderDailyCap(); return; }
  let cards = [];
  selected.forEach(id => { const tp = traitProgress(id); CARDS[id].forEach(c => { if (!tp.done.includes(c.id)) cards.push({ ...c, profileId: id }); }); });
  queue = shuffle(cards).slice(0, remain);
  queueIndex = 0;
  if (queue.length === 0) { renderSummary(); return; }
  renderCard();
}

function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

function renderCard() {
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  const c = queue[queueIndex], p = PROFILE_MAP[c.profileId];
  const tp = traitProgress(c.profileId), saved = tp.journal[c.id] || {};
  mcIndex = (saved.a1Index !== undefined) ? saved.a1Index : null;
  contextCustomMode = !!saved.useCustomContext;

  const CUSTOM_IDX = c.q1.options.length; // last option = "write my own"
  const mcAll = c.q1.options.concat(['✍️ 내 생각을 직접 쓸래요']);
  const mcOptions = mcAll.map((opt, i) => `
    <button class="opt ${mcIndex === i ? 'sel' : ''}" onclick="pickMc(${i})"><span class="dot"></span>${opt}</button>`).join('');
  const searchQuery = c.title;

  root().innerHTML = `
    ${trailHtml(queue.length, queueIndex, p.color)}
    <div class="sheet">
      <div class="card-tag-row">
        <span class="tag trait" style="--tc:${p.color}">${p.emoji} ${p.name}</span>
        <span class="tag atl">ATL · ${c.atl}</span>
        <span class="card-no">No. ${String(queueIndex + 1).padStart(2, '0')} / ${String(queue.length).padStart(2, '0')}</span>
      </div>
      <h2 class="title">${c.title}</h2>
      <div class="section-label">탐구 상황</div>
      <div class="context-toggle">
        <button type="button" class="toggle-btn ${!contextCustomMode ? 'active' : ''}" onclick="setContextMode(false)">제시된 이야기</button>
        <button type="button" class="toggle-btn ${contextCustomMode ? 'active' : ''}" onclick="setContextMode(true)">내 이야기 직접 쓰기</button>
      </div>
      <div id="contextBody">${contextCustomMode
        ? `<textarea class="field" id="customContextInput" placeholder="나에게 있었던 비슷한 상황을 직접 적어보세요...">${saved.customContext || ''}</textarea>`
        : contextDefaultHtml(c)}</div>

      <div class="tool-bar">
        <div class="tool-bar-label">이 상황, 직접 찾아보거나 해볼 수 있어요</div>
        <div class="tool-row">
          <input class="field" id="searchQuery" value="${escapeAttr(searchQuery)}" oninput="updateSearchLink()">
          <a class="tool-link" id="searchLink" href="https://www.google.com/search?q=${encodeURIComponent(searchQuery)}" target="_blank" rel="noopener">🔍 검색하기</a>
        </div>
        <div class="tool-row">
          <span class="timer-display" id="timerDisplay">00:30</span>
          <button type="button" class="timer-btn2" id="timerBtn" onclick="toggleTimer()">⏱️ 30초 도전</button>
        </div>
      </div>

      <div class="section-label">질문 1 · 골라보세요</div>
      <div class="qa-block">
        <div class="ask"><span class="ask-badge">Q1</span><span class="ask-text">${c.q1.text}</span></div>
        <div class="opt-list" id="mcList">${mcOptions}</div>
        <div id="a1CustomWrap" ${mcIndex === CUSTOM_IDX ? '' : 'hidden'}>
          <textarea class="field" id="a1CustomInput" placeholder="내 생각을 자유롭게 적어보세요...">${mcIndex === CUSTOM_IDX ? (saved.a1Custom || '') : ''}</textarea>
        </div>
      </div>
      <div class="section-label">질문 2 · 적어보세요</div>
      <div class="qa-block">
        <div class="ask"><span class="ask-badge">Q2</span><span class="ask-text">${c.q2}</span></div>
        <textarea class="field" id="a2Input" placeholder="나의 대답을 적어보세요...">${saved.a2 || ''}</textarea>
      </div>

      <div class="section-label">탐구 활동</div>
      <p class="mission-text">${c.mission}</p>
      <label class="mission-check"><input type="checkbox" id="missionDone" ${saved.missionDone ? 'checked' : ''}> 이 활동을 실제로 해봤어요</label>
      <div class="section-label">성찰</div>
      <p class="body-text">${c.reflect}</p>
      <textarea class="field" id="journalInput" placeholder="나의 생각을 적어보세요...">${saved.reflect || ''}</textarea>
      <button class="btn accent" style="margin-top:1rem" onclick="completeCard()">완료! 다음 카드 →</button>
    </div>`;
}
let contextCustomMode = false;
function contextDefaultHtml(c) {
  const v = VIDEO_MAP[c.id];
  return `<p class="body-text">${c.context}</p>` +
    (v ? `<a class="video-link" href="${escapeAttr(v.url)}" target="_blank" rel="noopener">🎥 예시 영상 보기 · ${escapeAttr(v.title)}</a>` : '');
}
function setContextMode(custom) {
  contextCustomMode = custom;
  document.querySelectorAll('.toggle-btn').forEach((el, i) => el.classList.toggle('active', (i === 1) === custom));
  const c = queue[queueIndex], tp = traitProgress(c.profileId), saved = tp.journal[c.id] || {};
  document.getElementById('contextBody').innerHTML = custom
    ? `<textarea class="field" id="customContextInput" placeholder="나에게 있었던 비슷한 상황을 직접 적어보세요...">${saved.customContext || ''}</textarea>`
    : contextDefaultHtml(c);
}
function updateSearchLink() {
  const q = document.getElementById('searchQuery').value.trim();
  document.getElementById('searchLink').href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
}
let timerHandle = null, timerSeconds = 30;
function toggleTimer() {
  const display = document.getElementById('timerDisplay'), btn = document.getElementById('timerBtn');
  if (timerHandle) {
    clearInterval(timerHandle); timerHandle = null;
    timerSeconds = 30; display.textContent = '00:30'; btn.textContent = '⏱️ 30초 도전';
    return;
  }
  timerSeconds = 30;
  btn.textContent = '⏹️ 멈추기';
  timerHandle = setInterval(() => {
    timerSeconds--;
    if (timerSeconds <= 0) {
      clearInterval(timerHandle); timerHandle = null;
      display.textContent = '완료! 🎉'; btn.textContent = '⏱️ 다시 하기'; timerSeconds = 30;
      return;
    }
    display.textContent = '00:' + String(timerSeconds).padStart(2, '0');
  }, 1000);
}
function pickMc(i) {
  mcIndex = i;
  document.querySelectorAll('#mcList .opt').forEach((el, idx) => el.classList.toggle('sel', idx === i));
  const wrap = document.getElementById('a1CustomWrap');
  const c = queue[queueIndex];
  wrap.hidden = (i !== c.q1.options.length);
}
function completeCard() {
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  const c = queue[queueIndex], tp = traitProgress(c.profileId);
  const CUSTOM_IDX = c.q1.options.length;
  const a2 = document.getElementById('a2Input').value.trim();
  const reflectText = document.getElementById('journalInput').value.trim();
  const missionDone = document.getElementById('missionDone').checked;
  const customContextEl = document.getElementById('customContextInput');
  const a1CustomEl = document.getElementById('a1CustomInput');
  const alreadyHad = tp.done.includes(c.id);
  if (!alreadyHad) tp.done.push(c.id);
  tp.journal[c.id] = {
    useCustomContext: contextCustomMode,
    customContext: customContextEl ? customContextEl.value.trim() : (tp.journal[c.id]?.customContext || ''),
    a1Index: mcIndex,
    a1: mcIndex === CUSTOM_IDX ? (a1CustomEl ? a1CustomEl.value.trim() : '') : (mcIndex !== null ? c.q1.options[mcIndex] : ''),
    a1Custom: mcIndex === CUSTOM_IDX && a1CustomEl ? a1CustomEl.value.trim() : '',
    a2, reflect: reflectText, missionDone
  };
  saveProgress();
  bumpDailyAndStreak();
  queueIndex++;

  const newlyEarned = !alreadyHad && traitBadgeEarned(c.profileId);
  const capReached = dailyRemaining() <= 0;
  const queueDone = queueIndex >= queue.length;

  if (newlyEarned) {
    pendingNext = capReached ? 'cap' : (queueDone ? 'summary' : 'card');
    renderBadgeEarned(c.profileId);
    return;
  }
  if (capReached) { renderDailyCap(); return; }
  if (queueDone) { renderSummary(); return; }
  renderCard();
}
function continueAfterBadge() {
  if (pendingNext === 'cap') renderDailyCap();
  else if (pendingNext === 'summary') renderSummary();
  else renderCard();
  pendingNext = null;
}
function renderBadgeEarned(id) {
  const p = PROFILE_MAP[id];
  root().innerHTML = `
    <div class="sheet badge-sheet">
      <div class="badge-medal-big" style="--tc:${p.color}">${p.emoji}</div>
      <div class="badge-earned-kicker">뱃지 획득!</div>
      <div class="badge-earned-title">${BADGE_TITLES[id]}</div>
      <p class="lede" style="text-align:center">${p.name} 카드 4장을 모두 채웠어요.<br>탐구 지도에 뱃지가 반짝여요.</p>
      <button class="btn accent" onclick="continueAfterBadge()">계속하기 →</button>
    </div>`;
}
function renderDailyCap() {
  const streakLine = streak.count > 1 ? `🔥 연속 ${streak.count}일째!` : '오늘 첫 탐구를 마쳤어요!';
  root().innerHTML = `
    <div class="sheet" style="text-align:center">
      <div class="badge-medal-big" style="--tc:var(--brass)">✅</div>
      <h2 class="title">오늘의 탐구 카드를 다 썼어요</h2>
      <p class="lede">${streakLine}<br>내일 또 ${DAILY_LIMIT}장이 채워져요. 조금씩 천천히 채워가요.</p>
      <button class="btn accent" onclick="renderMap()">🗺️ 나의 탐구 지도 보기</button>
      <button class="btn ghost" style="margin-top:.6rem" onclick="renderPicker()">← 돌아가기</button>
    </div>`;
}

function renderSummary() {
  const rows = selected.map(id => {
    const p = PROFILE_MAP[id], total = traitTotal(id), done = traitDoneCount(id);
    const pct = Math.round(done / total * 100), finished = traitBadgeEarned(id);
    return `<div class="summary-row">
      <div class="summary-badge" style="--tc:${p.color}">${finished ? '🏅' : p.emoji}</div>
      <div class="summary-body">
        <div class="summary-name">${p.name}</div>
        <div class="summary-lvl">${levelLabel(done, total)} · ${done}/${total}</div>
        <div class="summary-bar-wrap"><div class="summary-bar" style="width:${pct}%; --tc:${p.color}"></div></div>
      </div>
      ${finished ? '<span class="summary-done">완료</span>' : ''}
    </div>`;
  }).join('');
  const remain = dailyRemaining();
  root().innerHTML = `
    <div class="sheet">
      <div class="eyebrow">Entry closed</div>
      <h2 class="title">오늘의 탐구를 마쳤어요</h2>
      <p class="lede">질문에 답하며 생각한 시간이 학습자상을 조금씩 채워가고 있어요. ${remain > 0 ? `오늘 ${remain}장 더 할 수 있어요.` : '오늘 준비된 카드는 다 했어요.'}</p>
      ${rows}
      ${remain > 0 ? '<button class="btn accent" style="margin-top:1rem" onclick="renderPicker()">다른 영역 채우기</button>' : '<button class="btn accent" style="margin-top:1rem" onclick="renderDailyCap()">오늘 마무리하기</button>'}
      <button class="btn ghost" style="margin-top:.6rem" onclick="renderMap()">🗺️ 나의 탐구 지도 보기</button>
      <button class="btn ghost" style="margin-top:.6rem" onclick="renderCover()">↺ 진단부터 다시</button>
    </div>
    <p class="foot-note">IB PYP FIELD NOTES · QUESTION CARDS EDITION</p>`;
}

boot();
</script>
